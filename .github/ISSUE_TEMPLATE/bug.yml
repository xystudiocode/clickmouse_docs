name: "🐛Bug report"
title: "🐛[BUG]"
description: 报告一个bug。
labels: 
  - bug
type: Bug
body:
- type: markdown
  attributes:
    value: |
      > [!NOTE]
      > 为避免造成更多的麻烦，请在报告issue前，先检查是否有其他人已经报告过相同的问题。[检查是否存在重复](https://github.com/xystudiocode/pyClickMouse/issues)😊
      
      > [!IMPORTANT]
      > 我们不会在gitee上处理issue，请使用github发布。🙋‍♂️

      > [!TIP]
      > 请一次只报告1个问题。😀
- type: textarea
  attributes:
    label: 🐍描述你的bug
    placeholder: |
      请在这描述
    description: 🐍描述你的bug
  validations:
    required: true
- type: textarea
  attributes:
    label: 📄你的解决步骤想法是什么？
    placeholder: |
      - 解决方案1:
      - 1. 解决步骤1
      - 2. 解决步骤2
      - 3. 解决步骤3
      - 4. 解决步骤...
      - 解决方案2:
      - 1. 解决步骤1
      - 2. 解决步骤2
      - 3. 解决步骤3
      - 4. 解决步骤...
      - 解决方案3:
      - 1. 解决步骤1
      - 2. 解决步骤2
      - 3. 解决步骤3
      - 4. 解决步骤...
      - 其他解决方案...
    description: ♻️可以提供多个Bug解决方案，但请确保每个方案都能解决你的问题。
  validations:
    required: false
- type: textarea
  attributes:
    label: ➕其他相关信息
    placeholder: |
      你使用的操作系统版本、系统语言、造成bug软件等。
    description: ✉️提供更多信息，如操作系统版本、系统语言、造成bug软件等。
  validations:
    required: false